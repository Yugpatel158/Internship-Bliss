<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="icon" type="image/x-icon" href="tbs.jpeg">
    <style>

        table {
            border-collapse: collapse;
            width: 70%;
            height: 300px;
            align-items: center;    
            text-align: center;
        }
        tfoot {
            background-color: #ee6363;
        }
        th, td {
            padding: 8px;
            /* text-align: left; */
            
        }
        th {
            background-color: #9ac6dfc8;
        }
    </style>

</head>
<body style="justify-items: center;">
    <h1>HTML Table</h1>
    

    <table border="1">
        <thead>
            <tr>
                <th>Sr no.</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
    </thead>

        <tbody>
        <tr>
            <td>1</td>
            <td>Mathematics</td>
            <td>85</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Science</td>
            <td>90 </td>
        </tr>
        <tr>
            <td>3</td>
            <td>English</td>
            <td>80</td>
        </tr>
        <tr>
            <td>4</td>
            <td>History</td>
            <td>75</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Geography</td>
            <td>75</td>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2"><strong>Total</strong></td>
                <td><strong>405</strong></td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
