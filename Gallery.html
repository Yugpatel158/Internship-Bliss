<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0 auto;
            padding: 30px 20px;
        }

        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .block {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            height: 420px;
        }

        .block-left-big {
            grid-template-columns: 2fr 1fr 1fr;
            grid-template-areas:
                "big col1 col3"
                "big col2 col4";
        }

        .block-right-big {
            grid-template-columns: 1fr 1fr 2fr;
            grid-template-areas:
                "col1 col3 big"
                "col2 col4 big";
        }

        .cell {
            position: relative;
            overflow: hidden;
            border-radius: 6px;
        }

        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .cell:hover img {
            transform: scale(1.15);
        }

        .cell-big {
            grid-area: big;
        }

        .cell-c1 {
            grid-area: col1;
        }

        .cell-c2 {
            grid-area: col2;
        }

        .cell-c3 {
            grid-area: col3;
        }

        .cell-c4 {
            grid-area: col4;
        }
    </style>
</head>
